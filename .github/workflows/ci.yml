name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  linux-local:
    name: linux-local / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
          - compiler: clang

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI test image
        run: |
          docker buildx build --load \
            --target ci \
            --build-arg FPS_COMPILER=${{ matrix.compiler }} \
            -t fps:ci-local-${{ matrix.compiler }} .

      - name: Run local tests in CI image
        run: docker run --rm -e FPS_JOBS=2 fps:ci-local-${{ matrix.compiler }}

  docker-smoke:
    name: docker-smoke / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc
            dockerfile: Dockerfile
            compiler: gcc
          - name: ubuntu-clang
            dockerfile: Dockerfile
            compiler: clang
          - name: alpine-gcc
            dockerfile: Dockerfile.alpine
            compiler: gcc

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker build and runtime smoke
        env:
          FPS_DOCKER_COMPILER: ${{ matrix.compiler }}
          FPS_DOCKERFILE: ${{ matrix.dockerfile }}
          FPS_DOCKER_IMAGE: fps:ci-${{ matrix.name }}
        run: tools/run_quality_checks.sh --docker

  android-build:
    name: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Android CI image
        run: |
          docker buildx build --load \
            -f Dockerfile.android \
            -t fps:android-ci \
            --cache-from type=gha,scope=fps-android \
            --cache-to type=gha,mode=max,scope=fps-android \
            .

      - name: Run Android unit and assemble checks
        run: docker run --rm fps:android-ci
