services:
  fps-server:
    image: fps:local
    build:
      context: ../../..
      dockerfile: ${FPS_DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    ports:
      - "${FPS_PUBLISHED_PORT:-8443}:8443/tcp"
    environment:
      FPS_ROLE: server
      FPS_CONFIG: /etc/fps/server.json
      FPS_LOG_LEVEL: info
      FPS_CONFIGURE_TUN: "1"
      FPS_TUN_NAME: fpss0
      FPS_TUN_ADDRESS: 10.66.0.1/30
      FPS_TUN_MTU: "1280"
    volumes:
      - ./config/server.json:/etc/fps/server.json:ro
      - fps-server-state:/var/lib/fps
      - fps-server-run:/run/fps

volumes:
  fps-server-state:
  fps-server-run:
