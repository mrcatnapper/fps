# This example uses the host network namespace so FPS TUN routes affect the host.
# Review docs/docker.md and tools/fps_linux_route.sh before applying full-tunnel routes.
services:
  fps-client:
    image: fps:local
    build:
      context: ../../..
      dockerfile: ${FPS_DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    environment:
      FPS_ROLE: client
      FPS_CONFIG: /etc/fps/client.json
      FPS_LOG_LEVEL: info
      FPS_CONFIGURE_TUN: "1"
      FPS_TUN_NAME: fpsc0
      FPS_TUN_MTU: "1280"
    volumes:
      - ./config/client.json:/etc/fps/client.json:ro
      - fps-client-run:/run/fps

volumes:
  fps-client-run:
